# Puerto donde corre tu backend
server.port=9090

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tiendacoco?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Debe ser al menos 32 caracteres para HS256 (32 bytes = 256 bits)
jwt.secret=MiCadenaSuperSecretaQueTieneAlMenosTreintaYDosChar
# Tiempo de expiración en milisegundos (por ej. 1 hora = 3600000)
jwt.expirationMs=3600000
