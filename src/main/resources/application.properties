# Puerto donde corre tu backend
server.port=9090

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/tiendacoco?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# JWT
# Tiempo de expiración del token (en ms): 1 hora = 3600000 ms
jwt.expirationMs=3600000

# Para la firma HMAC-SHA256 necesitas una cadena suficientemente larga,
# guárdala en base64 o en texto plano si lo prefieres:
jwt.secret=MiSuperSecretoQueDebeSerLargo1234567890
